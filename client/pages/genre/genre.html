<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Games - Steam Top</title>
    <link rel="stylesheet" href="../../global.style.css">
    <link rel="stylesheet" href="./genre.style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="../../assets/images/Steam_icon.png" type="image/x-icon">
</head>

<body>
    <header class="header">
        <div class="headerContainer">
            <div class="headerLogo">
                <h1 class="logoText">Steam Library</h1>
            </div>

            <div class="headerSearch">
                <div class="searchContainer">
                    <svg class="searchIcon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                    <input type="text" class="searchInput" placeholder="Search games..." readonly>
                </div>
            </div>

            <div class="headerUser">
                <div class="userBalance">€0.00</div>
                <div class="userProfile">
                    <img class="userAvatar" src="https://via.placeholder.com/40x40/2b4361/ffffff?text=?"
                        alt="User Avatar">
                    <span class="userName">LOGIN</span>
                    <svg class="dropdownIcon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 10l5 5 5-5z" />
                    </svg>
                    <div class="userDropdown">
                        <a href="#" class="dropdownItem" data-action="logout">Logout</a>
                        <a href="#" class="dropdownItem" data-action="topup">Top Up Balance</a>
                    </div>
                </div>
                <div class="balanceModal" id="balanceModal">
                    <div class="modalContent">
                        <h2 class="modalTitle">Add Funds</h2>
                        <div class="balanceInputGroup">
                            <span class="euroIcon">€</span>
                            <input type="number" class="balanceInput" id="balanceAmount" placeholder="0.00" min="0.00"
                                step="0.01">
                        </div>
                        <div class="modalButtons">
                            <button class="modalBtn btnCancel" id="cancelTopup">Cancel</button>
                            <button class="modalBtn btnConfirm" id="confirmTopup">Add Funds</button>
                        </div>
                    </div>
                </div>
            </div>
    </header>
    <main>
        <div class="container">
            <h1 id="genreTitle">Loading...</h1>

            <div id="gamesLoader" class="loader" style="display: none;">Loading games...</div>

            <div class="gameList" id="gameList"></div>

            <div id="loadMoreContainer">
                <button id="loadMore" class="activeButton">
                    Load more games
                </button>
            </div>
        </div>
    </main>


    <script type="module" src="../../src/pages/genre.ts"></script>
</body>

</html>
